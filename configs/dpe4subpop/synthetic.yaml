# Synthetic subpopulation shift configuration for DPE smoke verification
method: dpe
experiment: synthetic_smoke

data:
  dataset_name: Features
  split_map:
    val: va
    test: te
  subsample_type: class
  train_attr: false
  norm_emb: true

model:
  emb_dim: 256
  num_classes: 2
  loss_name: isomax

training:
  num_stages: 4
  epochs: 5
  batch_size_train: 64
  batch_size_eval: 128
  lr: 0.001
  optim: sgd
  momentum: 0.9
  entropic: 20.0
  cov_reg: 10000.0
  alpha: 0.05
  seed: 0
