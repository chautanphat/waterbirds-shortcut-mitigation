# Descriptive notebook settings; upstream CLI does not automatically load this nested YAML.
# Waterbirds Stage-0 Backbone Training & Feature Extraction
method: erm
stage: 0
no_augmentation: true  # Standard SubpopBench protocol (no photometric distortion)

dataset:
  dataset_name: Waterbirds
  data_dir: data
  batch_size: 128
  batch_size_eval: 256
  workers: 4

model:
  model_name: resnet50
  pretrained_imgnet: true
  train_mode: full
  loss_name: ce

training:
  epochs: 100
  lr: 0.001
  momentum: 0.9
  optim: sgd
  optim_weight_decay: 0.0
  scheduler: none
  seed: 0

output:
  force_saving_feats: true
  ckpt_dir: checkpoints/waterbirds_stage0_standard_erm

