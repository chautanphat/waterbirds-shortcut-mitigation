study_name: "GCAW Pre-Flight Oracle & Staged Ablation Study (v7.1 - Real Data)"
watermark: "[DIAGNOSTIC & ABLATION STUDY — GCAW PROTOCOL v7.1 — REAL DATA ENFORCED]"

paths:
  oof_cache_dir: "outputs/weighting/oof_fits"
  eval_cache_dir: "outputs/weighting/fits"
  prediction_bundle_zip: "prediction_bundle.zip"
  output_dir: "results/dpe/gcaw_study_v7_1_real"

data:
  seeds: [0, 1, 2]
  expected_min_samples: 4000         # Chốt chặn cứng: Waterbirds test thật có N = 4974
  n_heads: 15
  n_classes: 2

margin_zone:
  p_max_low: 0.50
  p_max_high: 0.65                   # Vùng biên khả đảo cho alpha = 0.25

calibration:
  eps: 1.0e-6
  n_dist_quantiles: 3                # [Near (Q1), Medium (Q2), Far (Q3)]
  agreement_thresholds: [0.35, 0.70] # [Low (<=0.35), Mid (0.35-0.70), High (>0.70)]
  shrinkage_prior_m: 25.0

gcaw_hyperparams:
  alpha_mix: 0.25                    # w_j(x) = 0.75/15 + 0.25 * softmax(a_j(x))
  g1_gamma_raw: 50.0                 # Hệ số gốc của G1
  default_gamma_zscore: 2.0          # Hệ số cho khoảng cách đã chuẩn hóa Z-score nội mẫu
  default_beta_rel: 1.5              # Hệ số cho tín hiệu reliability đã chuẩn hóa Z-score nội mẫu
  n_random_permutations: 100

oracle_gate:
  max_weight_cap: 0.40
  aa_drop_tolerance: 0.01
  sigmoid_temp: 0.015
  l2_uniform_reg: 0.005
  max_iter: 400
